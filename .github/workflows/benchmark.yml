name: Scene performance budgets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/core/**"
      - "src/studio/Preview.tsx"
      - "src/service/read.ts"
      - "scripts/benchmarks/**"
      - "package*.json"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [main]
    paths:
      - "src/core/**"
      - "src/studio/Preview.tsx"
      - "src/service/read.ts"
      - "scripts/benchmarks/**"
      - "package*.json"
permissions:
  contents: read
concurrency:
  group: scene-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.2.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run core and actual Preview renderer budgets
        run: node --expose-gc --import tsx scripts/benchmarks/run.ts --browser --output benchmark-results.json
      - name: Keep measurements and machine characteristics even on regression
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: scene-performance-${{ github.sha }}
          path: benchmark-results.json
          if-no-files-found: warn
          retention-days: 30
